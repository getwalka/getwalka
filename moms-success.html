<style>

  </main>

<script src="moms-copy.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function () {
  "use strict";
  var WM = window.WALKA_MOMS;
  var STORAGE_KEY = "walka_moms_state_v1";

  function track(event, props) {
    try { if (window.posthog) posthog.capture(event, props || {}); } catch (e) {}
  }

  var state = null;
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state = JSON.parse(raw);
  } catch (e) {}

  var titleEl = document.getElementById("title");
  var bodyEl = document.getElementById("body");
  var noteEl = document.getElementById("note");

  var params = new URLSearchParams(window.location.search);
  var hasSessionId = !!params.get("session_id");

  if (state && state.localId) {
    titleEl.textContent = WM.COPY.success.title;
    bodyEl.textContent = WM.COPY.success.body;
    noteEl.textContent = WM.COPY.success.note;

    state.answers.checkout_status = "completed_unverified";
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}

    track(WM.EVENTS.checkoutCompleted, {
      local_id: state.localId,
      stake_cents: state.answers.stake_cents,
      miss_cents: state.answers.miss_cents,
      has_session_id: hasSessionId
    });

    if (window.supabase && WM.SUPABASE_URL.indexOf("REPLACE_ME") === -1 && WM.SUPABASE_ANON_KEY.indexOf("REPLACE_ME") === -1) {
      try {
        var sb = window.supabase.createClient(WM.SUPABASE_URL, WM.SUPABASE_ANON_KEY);
        sb.from(WM.SUPABASE_TABLE).update({
          checkout_status: "completed_unverified",
          updated_at: new Date().toISOString()
        }).eq("local_id", state.localId).then(function () {});
      } catch (e) {}
    }
  } else {
    // Different browser/device than onboarding, or storage was cleared.
    // We can't personalize or confirm which plan this was, since payment
    // already happened on Stripe's hosted page before redirecting here.
    titleEl.textContent = WM.COPY.returnMissing.title;
    bodyEl.textContent = WM.COPY.returnMissing.body;
    track(WM.EVENTS.checkoutCompleted, { local_id: null, has_session_id: hasSessionId, note: "no_local_state" });
  }
})();
</script>
