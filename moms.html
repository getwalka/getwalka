<style>
  :root{
    --maroon:#2B151F;
    --maroon-deep:#1F0F17;
    --cream:#F6EFE4;
    --cream-soft:#EFE3D2;
    --tan:#E7D2BE;
    --rose:#D9A98C;
    --rose-deep:#A8664F;
    --ink:#2B151F;
    --ink-soft:#6B5A60;
    --cream-ink-soft:rgba(246,239,228,.68);
    --line:rgba(246,239,228,.14);
    --line-onlight:rgba(43,21,31,.12);
    --r-card:22px;
    --r-inner:14px;
    --display:'Playfair Display',Georgia,serif;
    --body:'Inter',system-ui,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none !important}
  body{
    font-family:var(--body);font-size:17px;line-height:1.6;
    color:var(--cream);background:var(--maroon);min-height:100vh;
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;
    overflow-x:hidden;
  }
  img{max-width:100%;display:block}
  :focus-visible{outline:3px solid var(--rose);outline-offset:3px;border-radius:8px}

  .nav{
    position:sticky;top:0;z-index:50;
    background:color-mix(in srgb,var(--maroon) 86%,transparent);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  }
  .nav__in{display:flex;align-items:center;justify-content:space-between;height:64px;max-width:1080px;margin:0 auto;padding:0 24px}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none}
  .brand img{height:28px;width:auto;border-radius:7px}
  .brand__name{font-family:var(--display);font-weight:500;font-style:italic;font-size:1.3rem;color:var(--cream)}
  .exit{font-family:var(--body);font-weight:600;font-size:.88rem;color:var(--cream-ink-soft);text-decoration:none}
  .exit:hover{color:var(--cream)}

  main{
    min-height:calc(100vh - 64px);display:flex;flex-direction:column;
    justify-content:center;align-items:center;
    padding:40px 20px calc(40px + env(safe-area-inset-bottom, 0px));
  }
  .shell{max-width:680px;width:100%}

  /* The homepage is a full-bleed landing page, not a quiz card: it escapes
     the narrow centered shell entirely. Toggled on <body> by
     moms-app.js's renderStep(). */
  body.is-home main{min-height:0;padding:0;justify-content:flex-start;align-items:stretch}
  body.is-home .shell{max-width:none;width:100%}

  .resume-banner{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--tan);color:var(--ink-soft);font-weight:600;font-size:.82rem;
    border-radius:999px;padding:8px 10px 8px 16px;margin:20px auto 0;max-width:680px;
  }
  .resume-banner__dismiss{
    flex:none;width:22px;height:22px;border-radius:50%;border:none;cursor:pointer;
    background:rgba(255,255,255,.6);color:var(--ink-soft);font-size:.85rem;line-height:1;
  }

  .card{
    background:var(--cream);color:var(--ink);border-radius:var(--r-card);
    box-shadow:0 30px 70px -24px rgba(0,0,0,.5);
    padding:36px 32px;margin-bottom:18px;
  }

  @keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .card--enter{animation:cardIn .35s ease}
  @media (prefers-reduced-motion:reduce){ .card--enter{animation:none} }

  /* ================= shared type + section primitives ================= */

  .eyebrow{font-family:var(--mono);font-weight:700;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--rose);margin-bottom:10px;display:block}
  .eyebrow--mono{font-family:var(--mono)}

  .display{font-family:var(--display);font-weight:500;color:var(--cream);letter-spacing:-.01em;line-height:1.08}
  .display--xl{font-size:clamp(2.6rem,6.4vw,4rem);line-height:1.12;margin-bottom:22px}
  .display--lg{font-size:clamp(1.8rem,4.2vw,2.6rem);margin-bottom:16px}
  .hl{color:var(--rose);font-style:italic}
  .lede{color:var(--cream-ink-soft);font-size:1.08rem;line-height:1.6;max-width:34rem;margin-bottom:22px}

  .sec{width:100%;padding:72px 20px;position:relative;overflow:hidden}
  .sec__in{max-width:1080px;margin:0 auto;position:relative;z-index:1}
  .sec--hero{background:var(--maroon)}
  .sec--alt{background:var(--maroon-deep)}

  .wordmark{font-family:var(--display);font-weight:500;font-style:italic;font-size:1.5rem;color:var(--cream)}
  .wordmark--sm{font-size:1.1rem}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
    font-family:var(--body);font-weight:700;font-size:1rem;
    padding:1rem 1.9rem;border-radius:999px;text-decoration:none;border:none;cursor:pointer;
    transition:transform .15s ease,background .2s ease;
  }
  .btn:active{transform:scale(.97)}
  .btn--ink{background:var(--ink);color:var(--cream);box-shadow:0 10px 24px -8px rgba(0,0,0,.45)}
  .btn--ink:hover{background:#190B12}
  .btn--ink:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
  .btn--cream{background:var(--cream);color:var(--ink);box-shadow:0 10px 24px -8px rgba(0,0,0,.4)}
  .btn--cream:hover{background:#fff}
  .link{font-family:var(--body);font-weight:600;font-size:.95rem;color:var(--cream-ink-soft);background:none;border:none;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  .link:hover{color:var(--cream)}

  /* ================= decorative ring motif ================= */

  .ring-motif{position:absolute;pointer-events:none}
  .ring-motif circle{fill:none;stroke:var(--rose);stroke-width:.6;opacity:.32}
  .ring-motif--hero{top:-34px;left:-34px;z-index:0}
  .ring-motif--final{top:20px;right:20px;opacity:.6}

  /* ================= hero ================= */

  .hero__in{padding-top:8px}
  .hero__top{display:flex;align-items:center;justify-content:center;margin-bottom:48px}
  .hero__grid{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center}
  .hero__grid>*{min-width:0}
  .hero__cta-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .hero__media{position:relative}
  .hero__media-card{position:relative;z-index:1;border-radius:28px;overflow:hidden;background:var(--cream);box-shadow:0 34px 80px -26px rgba(0,0,0,.55)}
  .hero__media-card img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}
  @media (max-width:860px){
    .hero__grid{grid-template-columns:1fr;gap:30px}
  }

  /* ================= feature blocks + how it works (plain cream cards) ================= */

  .steps-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:30px}
  .steps-grid--4{grid-template-columns:repeat(2,1fr)}
  .steps-grid>*{min-width:0}
  .step-card{background:var(--cream);color:var(--ink);border-radius:var(--r-card);padding:26px}
  .step-card .eyebrow{color:var(--rose-deep)}
  @media (max-width:860px){ .steps-grid{grid-template-columns:1fr} }

  .step-card__title{font-family:var(--display);font-weight:600;font-size:1.3rem;margin-bottom:8px;color:var(--ink)}
  .step-card__body{font-size:.94rem;color:var(--ink-soft);line-height:1.55}

  /* ================= community spotlight (photo + copy) ================= */

  .spotlight{display:grid;grid-template-columns:.9fr 1.1fr;gap:48px;align-items:center}
  .spotlight>*{min-width:0}
  .spotlight__media{border-radius:28px;overflow:hidden;background:var(--cream);box-shadow:0 30px 70px -26px rgba(0,0,0,.5)}
  .spotlight__media img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
  @media (max-width:860px){ .spotlight{grid-template-columns:1fr;gap:28px} }

  /* ================= guarantee badge ================= */

  .guarantee-badge{
    display:inline-flex;align-items:center;gap:.4rem;margin-top:14px;
    font-family:var(--mono);font-weight:700;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;
    color:var(--maroon);background:var(--rose);border-radius:999px;padding:.5rem 1rem;
  }

  /* ================= disclaimer / footer text ================= */

  .q-disclaimer{color:var(--cream-ink-soft);font-size:.82rem;line-height:1.5;max-width:40rem}
  .card .q-disclaimer{color:var(--ink-soft)}

  /* ================= final CTA ================= */

  .final-cta{display:flex;align-items:center;justify-content:space-between;gap:32px;flex-wrap:wrap;padding-bottom:28px}
  .final-cta__copy{max-width:36rem}
  .final-cta__copy .lede{margin-bottom:0}
  .final-cta__footer{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:24px;border-top:1px solid var(--line)}
  .final-cta__legal{display:flex;gap:18px}
  .final-cta__legal a{font-size:.85rem;color:var(--cream-ink-soft);text-decoration:none}
  .final-cta__legal a:hover{color:var(--cream)}

  /* ================= sticky mobile CTA ================= */

  .sticky-cta{display:none}
  @media (max-width:640px){
    body.is-home .sec--alt:last-of-type{padding-bottom:104px}
    .sticky-cta{
      display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;
      padding:12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
      background:color-mix(in srgb,var(--maroon) 92%,transparent);
      backdrop-filter:blur(10px);border-top:1px solid var(--line);
    }
    .sticky-cta__btn{width:100%}
  }

  /* ================= checkout (unchanged logic, restyled) ================= */

  .q-title{font-family:var(--display);font-weight:500;font-size:1.8rem;letter-spacing:-.01em;line-height:1.1;margin-bottom:14px;color:var(--ink)}
  .q-body{color:var(--ink-soft);font-size:1rem;margin-bottom:16px}
  #gate .q-title,#gate .q-body{color:var(--cream)}
  #gate .q-body{color:var(--cream-ink-soft)}
  .q-note{background:var(--tan);color:var(--rose-deep);border-radius:var(--r-inner);padding:14px 16px;font-size:.9rem;margin-top:14px}
  .q-hint{color:var(--ink-soft);font-size:.82rem;margin-top:10px}
  .recap{background:var(--cream-soft);border-radius:var(--r-inner);padding:16px 18px;margin-bottom:18px}
  .recap__list{list-style:none;display:flex;flex-direction:column;gap:6px}
  .recap__list li{font-size:.88rem;color:var(--ink-soft);padding-left:20px;position:relative}
  .recap__list li::before{content:"✓";position:absolute;left:0;color:var(--rose-deep);font-weight:700}
  .q-error{color:#B3443A;font-size:.85rem;margin-top:10px;font-weight:600}
  .q-label{font-family:var(--body);font-weight:700;font-size:.88rem;margin:20px 0 10px;color:var(--ink)}
  .price-tag{font-family:var(--display);font-weight:600;font-size:2.1rem;letter-spacing:-.01em;margin:10px 0 2px;color:var(--ink)}

  .field{display:block;margin-top:16px}
  .field span{display:block;font-family:var(--body);font-weight:700;font-size:.88rem;margin-bottom:6px;color:var(--ink)}
  .field input{
    width:100%;font-family:var(--body);font-size:1rem;color:var(--ink);
    background:var(--cream-soft);border:1.5px solid var(--line-onlight);border-radius:var(--r-inner);
    padding:.75rem .9rem;
  }
  .field input:focus{border-color:var(--rose-deep)}

  .checkline{display:flex;align-items:flex-start;gap:10px;font-size:.88rem;color:var(--ink-soft);margin-top:18px;cursor:pointer}
  .checkline input{margin-top:3px;flex:none}
  .checkline a{color:var(--rose-deep);text-decoration:underline}

  #paymentElementContainer{margin-top:16px;padding:14px;border:1px solid var(--line-onlight);border-radius:12px}
  #paymentElementContainer.payment-pending{opacity:.55}
  #paymentElementContainer.payment-pending .q-hint{margin:0}
  #paymentElementContainer.payment-loading{display:flex;align-items:center;gap:10px}
  #paymentElementContainer.payment-loading .q-hint{margin:0}
  .payment-loading__dots{display:flex;gap:5px;flex:none}
  .payment-loading__dot{width:8px;height:8px;border-radius:50%;animation:preparingBounce 1.1s ease-in-out infinite}
  .payment-loading__dot--sage{background:var(--rose-deep);animation-delay:0s}
  .payment-loading__dot--lavender{background:var(--tan);animation-delay:.15s}
  .payment-loading__dot--amber{background:var(--ink);animation-delay:.3s}
  @keyframes preparingBounce{0%,80%,100%{transform:translateY(0);opacity:.6}40%{transform:translateY(-10px);opacity:1}}
  @media (prefers-reduced-motion:reduce){.payment-loading__dot{animation:none;opacity:.85}}

  .flownav{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:28px;max-width:680px;margin-left:auto;margin-right:auto;padding:0 20px}
  .flownav__right{display:flex;align-items:center;gap:18px}

  #loading{color:var(--cream-ink-soft);font-family:var(--body);font-weight:600;padding:60px 0}
  #gate{max-width:440px;text-align:center;margin:0 auto}
  #gate .btn{margin-top:18px}

  .footer{background:var(--maroon-deep);color:var(--cream-ink-soft);padding:22px 20px;text-align:center}
  .footer a{color:var(--cream-ink-soft);text-decoration:none;font-size:.82rem;margin:0 10px}
  .footer a:hover{color:var(--cream)}

  @media (max-width:480px){
    .sec{padding:48px 16px}
    .card{padding:24px 16px}
    .q-title{font-size:1.5rem}
    .final-cta{flex-direction:column;align-items:flex-start}
    .final-cta .btn{width:100%}
    .final-cta__footer{flex-direction:column;align-items:flex-start}
  }
</style>
</head>
<body>

<header class="nav">
  <div class="nav__in">
    <a class="brand" href="#top" aria-label="Walka home">
      <img src="logo.png" alt="" onerror="this.style.display='none'">
      <span class="brand__name">walka mom</span>
    </a>
    <a class="exit" href="/" id="exitLink" hidden>Save &amp; exit</a>
  </div>
</header>

<main id="top">
  <div class="shell">
    <div id="loading">Loading…</div>

    <div id="gate" hidden></div>

    <div id="app" hidden>
      <div class="resume-banner" id="resumeBanner" hidden>
        <span id="resumeBannerText"></span>
        <button type="button" class="resume-banner__dismiss" id="resumeBannerDismiss" aria-label="Dismiss">&times;</button>
      </div>
      <div id="screen"></div>
      <div class="flownav">
        <button type="button" class="link" id="backBtn" hidden>Back</button>
        <div class="flownav__right">
          <button type="button" class="link" id="skipBtn" hidden>Skip for now</button>
          <button type="button" class="btn btn--ink" id="continueBtn" hidden>Continue</button>
        </div>
      </div>
    </div>
  </div>
</main>

<div class="sticky-cta" id="stickyCta" hidden>
  <button type="button" class="btn btn--cream js-cta sticky-cta__btn">Find your village</button>
</div>

<footer class="footer">
  <a href="/moms-terms">Terms of Service</a>
  <a href="/moms-privacy">Privacy Policy</a>
</footer>

<script src="moms-copy.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://js.stripe.com/v3/"></script>
<script src="moms-app.js"></script>
</body>
</html>
