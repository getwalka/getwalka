<style>
  :root{
    --cream:#F7F1E8;--card:#FFFFFF;--ink:#1B2232;--ink-soft:#5A6079;
    --sage:#4E9C74;--sage-deep:#3F8862;--sage-tint:#E3F0E8;--line:rgba(43,46,74,.08);
    --display:'Quicksand',system-ui,sans-serif;--body:'Nunito Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none !important}
  body{
    font-family:var(--body);font-size:17px;line-height:1.6;color:var(--ink);background:var(--cream);
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    -webkit-font-smoothing:antialiased;
  }
  .card{background:var(--card);border-radius:24px;box-shadow:0 24px 60px -24px rgba(43,46,74,.25);padding:40px 32px;max-width:440px;text-align:center}
  .ic{width:56px;height:56px;border-radius:50%;background:var(--sage-tint);color:var(--sage);display:flex;align-items:center;justify-content:center;font-size:1.6rem;margin:0 auto 18px}
  h1{font-family:var(--display);font-weight:700;font-size:1.6rem;margin-bottom:10px}
  p{color:var(--ink-soft);margin-bottom:10px}
  .subtitle{font-size:.95rem;margin-bottom:0}

  .divider{height:1px;background:var(--line);margin:22px 0}

  .download-box{background:var(--sage-tint);border-radius:16px;padding:20px;text-align:left;margin:0}
  .download-box__title{font-family:var(--display);font-weight:700;font-size:.95rem;color:var(--ink);margin-bottom:6px}
  .download-box__body{font-size:.86rem;color:var(--ink-soft);margin-bottom:14px}
  .download-box strong{color:var(--ink)}
  a.store-btn{
    display:flex;align-items:center;justify-content:center;gap:.5rem;width:100%;
    font-family:var(--display);font-weight:600;font-size:.98rem;color:#fff;
    background:var(--ink);padding:.85rem 1.4rem;border-radius:999px;text-decoration:none;
  }
  a.store-btn:hover{background:#10141F}

  .next-box{background:var(--cream);border-radius:16px;padding:18px 20px;text-align:left;margin:20px 0}
  .next-box__title{font-family:var(--display);font-weight:700;font-size:.9rem;margin-bottom:14px;color:var(--ink)}
  .next-item{display:flex;gap:10px;margin-bottom:12px}
  .next-item:last-child{margin-bottom:0}
  .next-item__icon{flex:none;width:20px;color:var(--sage);font-weight:700}
  .next-item__title{font-family:var(--display);font-weight:700;font-size:.86rem;color:var(--ink);margin-bottom:2px}
  .next-item__body{font-size:.82rem;color:var(--ink-soft);margin-bottom:0;line-height:1.45}

  .cancel-fallback{font-size:.82rem;margin-top:18px}
</style>
</head>
<body>
  <main class="card" id="card">
    <div class="ic">✓</div>
    <h1 id="title">You're all set.</h1>
    <p class="subtitle" id="subtitle"></p>

    <div id="richContent" hidden>
      <div class="divider"></div>

      <div class="download-box">
        <p class="download-box__title" id="downloadLabel"></p>
        <p class="download-box__body" id="downloadBody"></p>
        <a class="store-btn" id="storeBtn" href="#">Download on the App Store</a>
      </div>

      <div class="next-box">
        <p class="next-box__title" id="nextTitle"></p>
        <div id="nextSteps"></div>
      </div>
    </div>

    <p class="cancel-fallback" id="cancelFallback" hidden></p>
  </main>

<script src="couch6k-copy.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function () {
  "use strict";
  var WS = window.WALKA_COUCH6K;
  var STORAGE_KEY = "walka_couch6k_state_v1"; // kept in sync with couch6k-app.js

  function track(event, props) {
    try { if (window.posthog) posthog.capture(event, props || {}); } catch (e) {}
  }

  function checkoutCurrency(a) {
    return (a && a.country === "CA") ? "cad" : "usd";
  }

  var state = null;
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state = JSON.parse(raw);
  } catch (e) {}

  var titleEl = document.getElementById("title");
  var subtitleEl = document.getElementById("subtitle");
  var richContent = document.getElementById("richContent");
  var downloadLabelEl = document.getElementById("downloadLabel");
  var downloadBodyEl = document.getElementById("downloadBody");
  var storeBtn = document.getElementById("storeBtn");
  var nextTitleEl = document.getElementById("nextTitle");
  var nextStepsEl = document.getElementById("nextSteps");
  var cancelFallbackEl = document.getElementById("cancelFallback");

  storeBtn.href = WS.APP_STORE_URL;
  storeBtn.textContent = WS.COPY.success.downloadCta;

  var params = new URLSearchParams(window.location.search);
  var hasPaymentIntent = !!params.get("payment_intent");

  if (state && state.localId) {
    var c = WS.COPY.success;
    var email = (state.answers && state.answers.email) || "";
    var currency = checkoutCurrency(state.answers);

    titleEl.textContent = c.title;
    subtitleEl.textContent = c.subtitle;
    richContent.hidden = false;

    downloadLabelEl.textContent = c.downloadLabel;
    downloadBodyEl.textContent = c.downloadBody.replace("{email}", email);

    nextTitleEl.textContent = c.nextTitle;
    nextStepsEl.innerHTML = c.nextSteps.map(function (step) {
      return '<div class="next-item"><span class="next-item__icon">&check;</span>' +
        '<div><p class="next-item__title">' + step.title + '</p>' +
        '<p class="next-item__body">' + step.body + '</p></div></div>';
    }).join("");

    cancelFallbackEl.textContent = c.cancelFallback;
    cancelFallbackEl.hidden = false;

    state.answers.checkout_status = "completed_unverified";
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}

    track(WS.EVENTS.checkoutCompleted, {
      local_id: state.localId,
      mode: state.answers.mode,
      total_cents: WS.TOTAL_CENTS,
      currency: currency,
      has_payment_intent: hasPaymentIntent
    });

    // Meta Pixel Purchase: deduped per local_id, same spirit as the moms
    // funnel's and the native app's payment-id dedup guard.
    try {
      var metaPurchaseKey = "meta_purchase:" + state.localId;
      if (window.fbq && !localStorage.getItem(metaPurchaseKey)) {
        fbq("track", "Purchase", { value: WS.TOTAL_CENTS / 100, currency: currency.toUpperCase() });
        localStorage.setItem(metaPurchaseKey, "1");
      }
    } catch (e) {}

    if (window.supabase) {
      try {
        var sb = window.supabase.createClient(WS.SUPABASE_URL, WS.SUPABASE_ANON_KEY);
        sb.from(WS.SUPABASE_TABLE).update({
          checkout_status: "completed_unverified",
          updated_at: new Date().toISOString()
        }).eq("local_id", state.localId).then(function () {});

        sb.functions.invoke("link-couch6k-purchase", { body: { local_id: state.localId } })
          .then(function () {})
          .catch(function (e) { console.warn("[couch6k-success] link-couch6k-purchase failed", e); });
      } catch (e) {}
    }
  } else {
    // Different browser/device than onboarding, or storage was cleared.
    titleEl.textContent = WS.COPY.returnMissing.title;
    subtitleEl.textContent = WS.COPY.returnMissing.body;
    track(WS.EVENTS.checkoutCompleted, { local_id: null, has_payment_intent: hasPaymentIntent, note: "no_local_state" });
  }
})();
</script>
</body>
</html>
