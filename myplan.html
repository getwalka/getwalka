<style>
  :root{
    --lavender:#E2DCFB;
    --periwinkle:#DCE2F7;
    --cream:#F7F2E7;
    --cream-deep:#EDE3D0;
    --pink:#FBD7E1;
    --rose:#F7C9D3;
    --yellow:#FBE7A6;
    --yellow-deep:#F3D878;
    --mint:#D7F0DE;
    --card:#FFFFFF;
    --ink:#1E1A2E;
    --ink-soft:#49465C;
    --indigo:#5A4FD6;
    --rose-ink:#8C1C44;
    --green-ink:#1F6E3D;
    --gold-ink:#8A6A16;
    --line:rgba(30,26,46,.12);
    --r-card:20px;
    --r-inner:14px;
    --display:'Anton',system-ui,sans-serif;
    --body:'Inter',system-ui,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none !important}
  body{
    font-family:var(--body);font-size:17px;line-height:1.6;
    color:var(--ink);background:var(--cream);min-height:100vh;
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;
  }
  img{max-width:100%;display:block}
  :focus-visible{outline:3px solid var(--indigo);outline-offset:3px;border-radius:8px}

  .nav{
    position:sticky;top:0;z-index:50;
    background:color-mix(in srgb,var(--cream) 90%,transparent);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  }
  .nav__in{display:flex;align-items:center;justify-content:space-between;height:64px;max-width:1080px;margin:0 auto;padding:0 24px}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none}
  .brand img{height:28px;width:auto}
  .brand__name{font-family:var(--display);font-weight:400;font-size:1.3rem;color:var(--ink)}
  .exit{font-family:var(--body);font-weight:600;font-size:.88rem;color:var(--ink-soft);text-decoration:none}
  .exit:hover{color:var(--ink)}

  main{
    min-height:calc(100vh - 64px);display:flex;flex-direction:column;
    justify-content:center;align-items:center;
    padding:40px 20px calc(40px + env(safe-area-inset-bottom, 0px));
  }
  .shell{max-width:680px;width:100%}

  /* The homepage is a full-bleed landing page, not a quiz card: it escapes
     the narrow centered shell entirely. Toggled on <body> by
     couch6k-app.js's renderStep(). */
  body.is-home main{min-height:0;padding:0;justify-content:flex-start;align-items:stretch}
  body.is-home .shell{max-width:none;width:100%}

  .resume-banner{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--lavender);color:var(--ink-soft);font-weight:600;font-size:.82rem;
    border-radius:999px;padding:8px 10px 8px 16px;margin:20px auto 0;max-width:680px;
  }
  .resume-banner__dismiss{
    flex:none;width:22px;height:22px;border-radius:50%;border:none;cursor:pointer;
    background:rgba(255,255,255,.6);color:var(--ink-soft);font-size:.85rem;line-height:1;
  }

  .card{
    background:var(--card);border-radius:var(--r-card);
    box-shadow:0 24px 60px -24px rgba(30,26,46,.25);
    padding:36px 32px;margin-bottom:18px;
  }

  @keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .card--enter{animation:cardIn .35s ease}
  @media (prefers-reduced-motion:reduce){ .card--enter{animation:none} }

  /* ================= shared type + section primitives ================= */

  .eyebrow{font-family:var(--body);font-weight:700;font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-ink);margin-bottom:10px;display:block}
  .eyebrow--mono{font-family:var(--mono);letter-spacing:.08em}
  .eyebrow--indigo{color:var(--indigo)}
  .eyebrow--rose{color:var(--rose-ink)}
  .eyebrow--green{color:var(--green-ink)}
  .eyebrow--gold{color:var(--gold-ink)}

  .display{font-family:var(--display);font-weight:400;color:var(--ink);letter-spacing:-.01em;line-height:1.02}
  .display--xl{font-size:clamp(2.6rem,7vw,4.6rem);margin-bottom:22px}
  .display--lg{font-size:clamp(1.9rem,4.6vw,3rem);margin-bottom:16px}
  .hl-mark{background:var(--yellow-deep);color:var(--ink);padding:0 .12em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
  .lede{color:var(--ink-soft);font-size:1.08rem;line-height:1.55;max-width:34rem;margin-bottom:22px}

  .sec{width:100%;padding:72px 20px}
  .sec__in{max-width:1080px;margin:0 auto}
  .sec--hero{background:var(--lavender)}
  .sec--cream{background:var(--cream)}
  .sec--pink{background:var(--pink)}
  .sec--yellow{background:var(--yellow)}
  .sec--periwinkle{background:var(--periwinkle);padding-bottom:40px}

  .wordmark{font-family:var(--display);font-weight:400;font-size:1.5rem;color:var(--ink)}
  .wordmark--sm{font-size:1.1rem}

  .badge{
    display:inline-flex;align-items:center;font-family:var(--mono);font-weight:700;
    font-size:.78rem;letter-spacing:.04em;border-radius:999px;padding:.5rem 1rem;
  }
  .badge--yellow{background:var(--yellow-deep);color:var(--ink)}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
    font-family:var(--body);font-weight:700;font-size:1rem;
    padding:1rem 1.9rem;border-radius:999px;text-decoration:none;border:none;cursor:pointer;
    transition:transform .15s ease,background .2s ease;
  }
  .btn:active{transform:scale(.97)}
  .btn--ink{background:var(--ink);color:#fff;box-shadow:0 10px 24px -8px rgba(30,26,46,.4)}
  .btn--ink:hover{background:#0F0C1A}
  .btn--ink:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
  .btn--sm{padding:.6rem 1.1rem;font-size:.86rem;flex:none}
  .link{font-family:var(--body);font-weight:600;font-size:.95rem;color:var(--ink-soft);background:none;border:none;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  .link:hover{color:var(--ink)}

  /* ================= hero ================= */

  .hero__in{padding-top:8px}
  .hero__top{display:flex;align-items:center;justify-content:space-between;margin-bottom:56px;flex-wrap:wrap;gap:12px}
  .hero__grid{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:start}
  .hero__cta-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .price-line{font-family:var(--mono);font-size:.84rem;color:var(--ink-soft)}

  .example-card{
    background:#fff;border-radius:var(--r-card);box-shadow:0 24px 60px -24px rgba(30,26,46,.3);
    padding:28px;
  }
  .example-card__steps{font-family:var(--display);font-weight:400;font-size:2.6rem;color:var(--ink);margin:8px 0 14px;line-height:1}
  .example-card__steps span{font-family:var(--mono);font-size:1rem;color:var(--ink-soft);font-weight:500}
  .example-card__bar{height:10px;border-radius:999px;background:var(--cream-deep);overflow:hidden;margin-bottom:22px}
  .example-card__bar-fill{height:100%;background:var(--indigo);border-radius:999px}
  .example-bubble{border-radius:var(--r-inner);padding:16px 18px;margin-bottom:14px}
  .example-bubble:last-child{margin-bottom:0}
  .example-bubble--pink{background:var(--pink)}
  .example-bubble--blue{background:#DCE6FB}
  .example-bubble__label{font-family:var(--mono);font-weight:700;font-size:.68rem;letter-spacing:.06em;color:var(--ink-soft);margin-bottom:6px}
  .example-bubble__text{font-size:.98rem;color:var(--ink);line-height:1.45}

  /* ================= your week ================= */

  .week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:14px;margin-top:36px}
  .week-card{border-radius:var(--r-inner);padding:20px 16px}
  .week-card--go{background:var(--mint)}
  .week-card--grace{background:var(--rose)}
  .week-card__label{font-family:var(--mono);font-weight:700;font-size:.74rem;color:var(--ink-soft);margin-bottom:14px}
  .week-card__value{font-family:var(--display);font-weight:400;font-size:1.7rem;color:var(--ink)}
  .week-card--grace .week-card__value{color:var(--rose-ink)}
  .week-card__unit{font-size:.84rem;color:var(--ink-soft);margin-top:2px}

  /* ================= coach ================= */

  .coach__in{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start}
  .coach-options{display:flex;flex-direction:column;gap:14px;margin-top:28px}
  .coach-option{
    text-align:left;background:transparent;border:1.5px solid rgba(30,26,46,.25);border-radius:var(--r-card);
    padding:20px 22px;cursor:pointer;transition:border-color .15s ease,background .15s ease;
  }
  .coach-option.is-active{background:#fff;border:2.5px solid var(--ink)}
  .coach-option__kicker{font-family:var(--mono);font-weight:700;font-size:.7rem;letter-spacing:.06em;color:var(--ink-soft);margin-bottom:8px}
  .coach-option__title{font-family:var(--display);font-weight:400;font-size:1.5rem;color:var(--ink);margin-bottom:6px}
  .coach-option__body{font-size:.92rem;color:var(--ink-soft);line-height:1.5}

  .coach__preview{padding-top:4px}
  .chat-stack{display:flex;flex-direction:column;gap:16px;margin-top:10px}
  .chat-bubble{background:#fff;border-radius:var(--r-card);padding:18px 20px}
  .chat-bubble__time{font-family:var(--mono);font-weight:700;font-size:.7rem;color:var(--ink-soft);margin-bottom:8px}
  .chat-bubble__text{font-size:1rem;color:var(--ink);line-height:1.5}

  /* ================= how it works ================= */

  .steps-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:32px;margin-bottom:20px}
  .step-card{background:#fff;border-radius:var(--r-card);padding:26px}
  .step-card__title{font-family:var(--display);font-weight:400;font-size:1.5rem;margin-bottom:10px}
  .step-card__body{font-size:.94rem;color:var(--ink-soft);line-height:1.55}

  .outcome-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .outcome-card{border-radius:var(--r-card);padding:28px}
  .outcome-card--hit{background:var(--mint)}
  .outcome-card--miss{background:var(--rose)}
  .outcome-card__headline{font-family:var(--display);font-weight:400;font-size:1.7rem;line-height:1.1}
  .outcome-card--hit .outcome-card__headline{color:var(--green-ink)}
  .outcome-card--miss .outcome-card__headline{color:var(--rose-ink)}

  /* ================= community (static preview, not live) ================= */

  .community-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:36px}
  .community-card{background:#fff;border-radius:var(--r-card);padding:26px}
  .community-card__text{font-family:var(--display);font-weight:400;font-size:1.45rem;line-height:1.15;color:var(--ink);margin-bottom:18px}
  .vote-row{display:flex;align-items:center;gap:14px;margin-bottom:20px}
  .vote-pill{font-family:var(--mono);font-weight:700;font-size:.82rem;color:var(--ink);background:var(--cream);border-radius:999px;padding:.4rem .9rem}
  .vote-count{font-size:.86rem;color:var(--ink-soft)}
  .reply-list{display:flex;flex-direction:column;gap:14px;margin-bottom:16px}
  .reply{display:flex;gap:12px}
  .reply__avatar{flex:none;width:32px;height:32px;border-radius:50%;background:var(--lavender);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:.8rem;color:var(--ink)}
  .reply__meta{font-size:.84rem;color:var(--ink-soft);margin-bottom:2px}
  .reply__meta strong{color:var(--ink);font-weight:700}
  .reply__text{font-size:.92rem;color:var(--ink);line-height:1.45}
  .reply-form{display:flex;gap:10px}
  .reply-form__input{
    flex:1;min-width:0;font-family:var(--body);font-size:.92rem;color:var(--ink);
    background:var(--cream);border:1.5px solid var(--line);border-radius:999px;padding:.65rem 1rem;
  }
  .reply-form__input:disabled{opacity:.7;cursor:default}

  /* ================= pricing ================= */

  .price-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:32px}
  .price-card{border-radius:var(--r-card);padding:24px}
  .price-card--lavender{background:var(--lavender)}
  .price-card--mint{background:var(--mint)}
  .price-card--rose{background:var(--rose)}
  .price-card--gold{background:var(--yellow)}
  .price-card__value{font-family:var(--display);font-weight:400;font-size:2.1rem;color:var(--ink);margin-bottom:10px}
  .price-card__note{font-size:.86rem;color:var(--ink-soft);line-height:1.45}

  .total-card{
    display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;
    background:#fff;border-radius:var(--r-card);padding:28px;margin-top:20px;
  }
  .total-card__figure .eyebrow{margin-bottom:6px}
  .total-card__value{font-family:var(--display);font-weight:400;font-size:2.1rem;color:var(--ink)}
  .total-card__note{flex:1;min-width:16rem;font-size:.92rem;color:var(--ink-soft);line-height:1.5}

  /* ================= rules accordion (shared) ================= */

  .q-label{font-family:var(--body);font-weight:700;font-size:.92rem;margin:20px 0 10px}
  .accordion{border:1px solid var(--line);border-radius:var(--r-inner);overflow:hidden;background:#fff}
  .accordion-item+.accordion-item{border-top:1px solid var(--line)}
  .accordion-toggle{
    width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;
    font-family:var(--body);font-weight:600;font-size:.9rem;color:var(--ink);
    background:none;border:none;padding:14px 16px;cursor:pointer;text-align:left;
  }
  .accordion-toggle__caret{color:var(--ink-soft);font-weight:400;transition:transform .15s ease}
  .accordion-toggle[aria-expanded="true"] .accordion-toggle__caret{transform:rotate(45deg)}
  .accordion-body{padding:0 16px 16px;font-size:.86rem;color:var(--ink-soft);line-height:1.55}

  /* ================= final CTA ================= */

  .final-cta{display:flex;align-items:center;justify-content:space-between;gap:32px;flex-wrap:wrap;padding-bottom:40px;border-bottom:1px solid rgba(30,26,46,.14)}
  .final-cta__copy{max-width:36rem}
  .final-cta__copy .lede{margin-bottom:0}
  .final-cta__footer{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:24px}
  .final-cta__legal{display:flex;gap:18px}
  .final-cta__legal a{font-size:.85rem;color:var(--ink-soft);text-decoration:none}
  .final-cta__legal a:hover{color:var(--ink)}
  .final-cta__domain{font-family:var(--mono);font-size:.82rem;color:var(--ink-soft)}

  /* ================= checkout (unchanged logic, restyled) ================= */

  .q-title{font-family:var(--display);font-weight:400;font-size:1.9rem;letter-spacing:-.01em;line-height:1.1;margin-bottom:14px}
  .q-body{color:var(--ink-soft);font-size:1rem;margin-bottom:16px}
  .q-note{background:var(--mint);color:var(--green-ink);border-radius:var(--r-inner);padding:14px 16px;font-size:.9rem;margin-top:14px}
  .q-hint{color:var(--ink-soft);font-size:.82rem;margin-top:10px}
  .recap{background:var(--cream);border-radius:var(--r-inner);padding:16px 18px;margin-bottom:18px}
  .recap__list{list-style:none;display:flex;flex-direction:column;gap:6px}
  .recap__list li{font-size:.88rem;color:var(--ink-soft);padding-left:20px;position:relative}
  .recap__list li::before{content:"✓";position:absolute;left:0;color:var(--green-ink);font-weight:700}
  .q-error{color:#B3443A;font-size:.85rem;margin-top:10px;font-weight:600}

  .field{display:block;margin-top:16px}
  .field span{display:block;font-family:var(--body);font-weight:700;font-size:.88rem;margin-bottom:6px}
  .field input{
    width:100%;font-family:var(--body);font-size:1rem;color:var(--ink);
    background:var(--cream);border:1.5px solid var(--line);border-radius:var(--r-inner);
    padding:.75rem .9rem;
  }
  .field input:focus{border-color:var(--indigo)}

  .checkline{display:flex;align-items:flex-start;gap:10px;font-size:.88rem;color:var(--ink-soft);margin-top:18px;cursor:pointer}
  .checkline input{margin-top:3px;flex:none}
  .checkline a{color:var(--indigo);text-decoration:underline}

  .charge-breakdown{background:var(--cream);border-radius:var(--r-inner);padding:4px 18px;margin:16px 0}
  .charge-breakdown__row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:.95rem}
  .charge-breakdown__row:last-child{border-bottom:none}
  .charge-breakdown__row span{color:var(--ink-soft)}
  .charge-breakdown__row strong{font-family:var(--body);color:var(--ink)}

  #paymentElementContainer{margin-top:16px;padding:14px;border:1px solid var(--line);border-radius:12px}
  #paymentElementContainer.payment-pending{opacity:.55}
  #paymentElementContainer.payment-pending .q-hint{margin:0}
  #paymentElementContainer.payment-loading{display:flex;align-items:center;gap:10px}
  #paymentElementContainer.payment-loading .q-hint{margin:0}
  .payment-loading__dots{display:flex;gap:5px;flex:none}
  .payment-loading__dot{width:8px;height:8px;border-radius:50%;animation:preparingBounce 1.1s ease-in-out infinite}
  .payment-loading__dot--sage{background:var(--green-ink);animation-delay:0s}
  .payment-loading__dot--lavender{background:var(--indigo);animation-delay:.15s}
  .payment-loading__dot--amber{background:var(--gold-ink);animation-delay:.3s}
  @keyframes preparingBounce{0%,80%,100%{transform:translateY(0);opacity:.6}40%{transform:translateY(-10px);opacity:1}}
  @media (prefers-reduced-motion:reduce){.payment-loading__dot{animation:none;opacity:.85}}

  .flownav{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:28px;max-width:680px;margin-left:auto;margin-right:auto;padding:0 20px}
  .flownav__right{display:flex;align-items:center;gap:18px}

  #loading{color:var(--ink-soft);font-family:var(--body);font-weight:600;padding:60px 0}
  #gate{max-width:440px;text-align:center;margin:0 auto}
  #gate .btn{margin-top:18px}

  .footer{background:var(--ink);color:#8B8EA3;padding:22px 20px;text-align:center}
  .footer a{color:#B9BCCB;text-decoration:none;font-size:.82rem;margin:0 10px}
